<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS — The internet, organized.</title>
<meta name="description" content="Live news across every category — world, politics, business, tech, science, sports, entertainment and more — in one place.">
<style>
:root{--bg:#0a0b0d;--panel:#111318;--ink:#f5f5f2;--muted:#8f939c;--line:#25282f;--accent:#d8ff46;--max:1440px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:var(--max);margin:auto;padding:0 28px}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
button:focus-visible,input:focus-visible,.story:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.nav{height:72px;display:flex;align-items:center;gap:28px}
.logo{font-weight:900;font-size:26px;letter-spacing:.02em}
.search{flex:1;min-width:0;max-width:520px;margin-left:auto;display:flex;height:42px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;padding:0 14px}
.search button{border:0;border-radius:999px;padding:0 16px;background:#f4f4ef;color:#090a0c;font-weight:800;cursor:pointer}
.live{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800;white-space:nowrap}

/* category switcher */
.cats{position:sticky;top:0;z-index:20;background:rgba(10,11,13,.9);backdrop-filter:blur(18px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cats .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
.cats .wrap::-webkit-scrollbar{display:none}
.cat{flex:none;border:1px solid transparent;background:none;color:#9a9ea7;cursor:pointer;font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;white-space:nowrap}
.cat:hover{color:#fff;background:var(--panel)}
.cat.on{background:var(--accent);color:#0a0b0d}
.cat small{margin-left:6px;font-size:10px;opacity:.6}

/* headings */
.head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding:34px 0 13px}
.head h1,.head h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:0}
.head span{font-size:11px;color:#686d76}
.section{padding-top:56px}

/* lead stories */
.grid{display:grid;grid-template-columns:1.55fr .725fr .725fr;grid-template-rows:260px 260px;gap:10px;margin-top:12px}
.story{position:relative;overflow:hidden;background:#15171b;border-radius:12px;cursor:pointer}
.story img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s}
.story:hover img{transform:scale(1.045)}
.story:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,rgba(0,0,0,.9))}
.main{grid-row:span 2}
.copy{position:absolute;z-index:2;bottom:0;left:0;right:0;padding:22px}
.tag{font-size:9px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--accent)}
.copy h3{font-size:25px;line-height:1.2;letter-spacing:0;margin:8px 0}
.small h3{font-size:18px;line-height:1.25}
.meta{font-size:11px;color:#aaa}

/* feed */
.feed{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.item{border:1px solid var(--line);background:var(--panel);border-radius:10px;overflow:hidden;cursor:pointer}
.item img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#17191d}
.itembody{padding:16px}
.item h3{font-size:19px;line-height:1.25;letter-spacing:0;margin:8px 0}
.item p{color:var(--muted);font-size:12px;margin:0 0 10px}
.noimg{height:100%;min-height:120px;display:grid;place-items:center;color:#555a64;font-size:9px;letter-spacing:.15em;background:#17191d}
.empty{padding:45px;border:1px dashed var(--line);color:var(--muted);text-align:center;margin-top:12px;border-radius:12px}
.empty button,.morebtn{border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:700}
.morewrap{text-align:center;margin-top:22px}
.skel{background:linear-gradient(90deg,#15171b,#1d2025,#15171b);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}

/* reader */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(12px);z-index:50;display:none;padding:20px;overflow:auto}
.modal.show{display:grid;place-items:center}
.reader{width:min(920px,100%);max-height:92vh;overflow:auto;background:#0e1014;border:1px solid #2a2d34;border-radius:16px}
.reader img{width:100%;max-height:420px;object-fit:cover;display:block}
.readerbody{padding:28px}
.close{float:right;border:1px solid var(--line);background:#111318;color:#fff;border-radius:8px;width:36px;height:36px;cursor:pointer}
.reader h2{font-size:clamp(28px,4.5vw,46px);line-height:1.15;letter-spacing:0;margin:8px 0 18px}
.reader .deck{font-size:18px;color:#b9bdc5}
.readertext{max-width:700px;margin-top:30px}
.readertext p{font:18px/1.8 Georgia,serif;color:#d2d3d5}
.articlehead{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:800;margin:30px 0 0}
.readlink{display:inline-block;margin:6px 0 26px;padding:12px 18px;border-radius:999px;background:#f4f4ef;color:#090a0c;font-weight:800}
.readlink:hover{background:var(--accent)}
.loading{color:var(--muted);font:15px/1.6 Inter,system-ui,sans-serif}
.source{border-top:1px solid var(--line);padding-top:16px;color:#6f747e;font-size:11px}

.footer{border-top:1px solid var(--line);margin-top:70px;padding:24px 0 45px;color:#696e77;font-size:11px;display:flex;justify-content:space-between;gap:12px}

@media(max-width:900px){
  .grid{grid-template-columns:1fr 1fr;grid-template-rows:330px 220px}
  .main{grid-column:span 2;grid-row:auto}
  .feed{grid-template-columns:1fr 1fr}
}
@media(max-width:620px){
  .wrap{padding:0 16px}
  .nav{gap:12px}
  .live{display:none}
  .grid{display:block}
  .story{height:235px;margin-top:10px}
  .main{height:360px}
  .feed{grid-template-columns:1fr}
  .footer{display:block}
  .footer span{display:block;margin:7px 0}
}
</style>
</head>
<body>
<header class="wrap nav">
  <a class="logo" href="#top">NEXUS</a>
  <span class="live" id="live">● Live</span>
  <form class="search" id="form" role="search">
    <input id="q" type="search" placeholder="Search news…" aria-label="Search news" autocomplete="off">
    <button>Search</button>
  </form>
</header>
<nav class="cats" aria-label="News categories"><div class="wrap" id="cats"></div></nav>

<main class="wrap">
  <div class="head"><h1 id="heading">Top</h1><span id="status">Loading live stories…</span></div>
  <div class="grid" id="grid"></div>
  <div class="head section"><h2 id="moreHeading">More stories</h2><span id="count"></span></div>
  <div class="feed" id="feed"></div>
  <div class="morewrap" id="more"></div>
</main>
<footer class="wrap footer"><span>NEXUS · THE INTERNET, ORGANIZED.</span><span>Headlines from live publisher feeds · refreshes every 5 minutes.</span></footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Story" onclick="if(event.target===this)closeReader()">
  <article class="reader">
    <button class="close" onclick="closeReader()" aria-label="Close">×</button>
    <img id="rimg" alt="">
    <div class="readerbody"><div class="tag" id="rtag"></div><h2 id="rtitle"></h2><div class="deck" id="rdeck"></div><div class="articlehead">The article</div><div class="readertext" id="rtext"></div><a class="readlink" id="rlink" target="_blank" rel="noopener noreferrer" hidden></a><div class="source" id="rsource"></div></div>
  </article>
</div>

<script>
// "top" shows everything; the rest filter on story.category. Keep ids in sync with api/feed.js.
const CATEGORIES=[
  ["top","Top"],["world","World"],["us","U.S."],["politics","Politics"],["business","Business"],
  ["tech","Technology"],["ai","AI"],["science","Science"],["health","Health"],["sports","Sports"],
  ["entertainment","Entertainment"],["gaming","Gaming"],["music","Music"],["environment","Environment"],
  ["food","Food"],["travel","Travel"]
];
const LABEL=Object.fromEntries(CATEGORIES);
const LEAD=5,PAGE=12;
let all=[],active=CATEGORIES.some(c=>c[0]===location.hash.slice(1))?location.hash.slice(1):"top",term="",shown=PAGE,updatedAt=null,failed=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean=(v="")=>String(v||"").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g,"").replace(/```(?:json|text)?/gi,"").replace(/\s{2,}/g," ").trim();
function ago(d){
  const t=new Date(d).getTime();if(isNaN(t))return"Recently";
  const m=Math.round((Date.now()-t)/60000);
  if(m<1)return"Just now";if(m<60)return m+"m ago";
  if(m<1440)return Math.round(m/60)+"h ago";
  return new Date(t).toLocaleDateString([],{month:"short",day:"numeric"});
}
const img=s=>s.imageUrl?'<img src="'+esc(String(s.imageUrl).replace(/^http:/i,"https:"))+'" alt="'+esc(s.imageAlt||s.title)+'" loading="lazy" onerror="this.outerHTML=\'<div class=noimg>PHOTO UNAVAILABLE</div>\'">':'<div class="noimg">PHOTO UNAVAILABLE</div>';
function sourceLink(id){try{const b=String(id).replace(/-/g,'+').replace(/_/g,'/'),u=new URL(decodeURIComponent(escape(atob(b))));return u.protocol==='https:'?u.href:''}catch{return''}}
const tagLine=s=>esc(LABEL[s.category]||s.category)+' · '+esc(s.sourceName);

function visible(){
  const t=term.toLowerCase();
  return all.filter(s=>(active==="top"||s.category===active)&&(!t||(s.title+" "+(s.summary||"")+" "+s.sourceName).toLowerCase().includes(t)));
}
function counts(){const c={top:all.length};all.forEach(s=>c[s.category]=(c[s.category]||0)+1);return c}

function renderTabs(){
  const c=counts();
  $("cats").innerHTML=CATEGORIES.map(([id,name])=>'<button class="cat'+(id===active?' on':'')+'" data-cat="'+id+'"'+(id===active?' aria-current="true"':'')+'>'+name+(all.length?'<small>'+(c[id]||0)+'</small>':'')+'</button>').join("");
}
function revealTab(){const on=$("cats").querySelector(".on");if(on)on.scrollIntoView({inline:"center",block:"nearest"})}
function render(){
  const list=visible(),name=LABEL[active];
  $("heading").textContent=term?name+' · "'+term+'"':name;
  $("moreHeading").textContent=active==="top"?"More stories":"More "+name;
  $("count").textContent=list.length?list.length+(list.length===1?" story":" stories"):"";
  $("grid").innerHTML=list.length?list.slice(0,LEAD).map((s,i)=>'<article class="story '+(i?"small":"main")+'" tabindex="0" data-id="'+esc(s.id)+'">'+img(s)+'<div class="copy"><div class="tag">'+tagLine(s)+'</div><h3>'+esc(s.title)+'</h3><div class="meta">'+ago(s.publishedAt)+'</div></div></article>').join(""):"";
  const rest=list.slice(LEAD,LEAD+shown);
  $("feed").innerHTML=rest.map(s=>'<article class="item" tabindex="0" data-id="'+esc(s.id)+'">'+img(s)+'<div class="itembody"><div class="tag">'+tagLine(s)+' · '+ago(s.publishedAt)+'</div><h3>'+esc(s.title)+'</h3><p>'+esc(s.summary||"")+'</p></div></article>').join("");
  $("more").innerHTML=list.length>LEAD+shown?'<button class="morebtn" id="morebtn">Show more '+esc(name)+'</button>':"";
  if(!all.length&&failed){
    $("feed").innerHTML='<div class="empty" style="grid-column:1/-1">Live news is temporarily unavailable. NEXUS could not reach its news sources, so there are no stories to show right now.<br><br><button id="retry">Try again</button></div>';
  }else if(!list.length&&all.length){
    $("feed").innerHTML='<div class="empty" style="grid-column:1/-1">'+(term?'No '+esc(name)+' stories match “'+esc(term)+'”. ':'No '+esc(name)+' stories right now. ')+'<br><br><button id="reset">'+(term?"Clear search":"Back to Top")+'</button></div>';
  }
  $("status").textContent=failed?(all.length?"Couldn't refresh · showing stories from "+ago(updatedAt):"Live sources unavailable"):all.length?"Updated "+ago(updatedAt):"Loading live stories…";
  $("live").textContent=failed?"● Offline":"● Live";
  renderTabs();
}
function setCategory(id,push=true){
  if(!LABEL[id])return;
  active=id;shown=PAGE;
  if(push&&location.hash.slice(1)!==id)history.pushState(null,"","#"+id);
  render();revealTab();window.scrollTo({top:Math.min(window.scrollY,$("cats").offsetTop),behavior:"smooth"});
}

async function load(){
  const first=!all.length;
  if(first)$("grid").innerHTML='<div class="skel main"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  try{
    const r=await fetch("/api/feed"),d=await r.json();
    if(!r.ok||!d.stories||!d.stories.length)throw new Error(d.error||"No stories");
    all=d.stories;updatedAt=d.updatedAt;failed=false;
  }catch{failed=true}
  render();if(first)revealTab();
}

/* reader */
async function openReader(id){
  const base=all.find(s=>s.id===id);if(!base)return;
  const modal=$("modal"),image=$("rimg"),title=clean(base.title),summary=clean(base.summary);
  modal.classList.add("show");document.body.style.overflow="hidden";modal.scrollTop=0;
  $("rtag").textContent=(LABEL[base.category]||base.category)+" · "+base.sourceName+" · "+ago(base.publishedAt);
  lastFocus=document.activeElement;$("modal").querySelector(".close").focus();
  $("rtitle").textContent=title;
  $("rdeck").textContent=summary||"NEXUS Brief";
  $("rsource").textContent="NEXUS Brief · Loading…";
  $("rtext").innerHTML="<p>"+esc(summary||"")+"</p><p class=\"loading\">Loading the full article…</p>";
  const link=sourceLink(id),rl=$("rlink");
  if(link){rl.href=link;rl.textContent="Read the full article on "+base.sourceName.replace(/^(BBC|NPR|The Guardian)\b.*/,"$1")+" →";rl.hidden=false}else rl.hidden=true;
  if(base.imageUrl){image.src=base.imageUrl;image.alt=base.imageAlt||title;image.style.display="block"}else{image.removeAttribute("src");image.style.display="none"}
  try{
    const r=await fetch("/api/article?id="+encodeURIComponent(id),{headers:{Accept:"application/json"}}),a=await r.json();
    if(!r.ok)throw new Error(a&&a.error||"Article request failed");
    if(!$("modal").classList.contains("show")||$("rtitle").textContent!==title)return; // user moved on
    const sections=Array.isArray(a.sections)?a.sections.filter(x=>x&&x.text):[];
    $("rtitle").textContent=clean(a.title||title);
    $("rdeck").textContent=clean(a.deck||a.summary||summary)||"NEXUS Brief";
    if(a.imageUrl){image.src=String(a.imageUrl).replace(/^http:/i,"https:");image.style.display="block"}
    $("rtext").innerHTML=sections.length?sections.map(x=>"<p>"+(x.heading?"<strong>"+esc(clean(x.heading))+"</strong><br>":"")+esc(clean(x.text))+"</p>").join(""):"<p>"+esc(clean(a.summary||summary))+"</p>";
    $("rsource").textContent=a.note||"NEXUS Brief · Rephrased from source material.";
  }catch{
    $("rtext").innerHTML="<p>"+esc(summary||"The detailed brief is unavailable right now.")+"</p>";
    $("rsource").textContent="NEXUS Brief · Full brief unavailable, showing the publisher's summary";
  }
}
let lastFocus=null;
function closeReader(){$("modal").classList.remove("show");document.body.style.overflow="";if(lastFocus&&lastFocus.focus)lastFocus.focus()}

/* events */
document.addEventListener("click",e=>{
  const card=e.target.closest(".story,.item");if(card){openReader(card.dataset.id);return}
  const c=e.target.closest("[data-cat]");if(c){setCategory(c.dataset.cat);return}
  if(e.target.id==="retry"){load();return}
  if(e.target.id==="morebtn"){shown+=PAGE;render();return}
  if(e.target.id==="reset"){if(term){term="";$("q").value=""}else active="top";shown=PAGE;render()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeReader();
  if(e.key==="Enter"&&(e.target.classList.contains("story")||e.target.classList.contains("item")))openReader(e.target.dataset.id);
});
$("form").addEventListener("submit",e=>{e.preventDefault();term=$("q").value.trim();shown=PAGE;render()});
$("q").addEventListener("input",()=>{if(!$("q").value.trim()&&term){term="";shown=PAGE;render()}});
window.addEventListener("hashchange",()=>{const id=location.hash.slice(1)||"top";if(LABEL[id]&&id!==active)setCategory(id,false)});

renderTabs();revealTab();load();setInterval(load,300000);
</script>
</body>
</html>
